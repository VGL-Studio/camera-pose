# Runs the standard test scenarios on the staging build in an emulator and keeps the device log, so the auto-run
# session can analyse it before staging.yml sends the build to the team (docs/auto-run.md, section 4;
# docs/ops/test-sessions.md). Same tool and folder layout as a test session on a physical device:
# scripts/device-session.sh start, scenarios, stop.
# The job is red when the app crashed or did not respond (ANR); the session then does not send the build.
# Started by the auto-run session (gh api .../dispatches) or by hand. About 25 minutes of CI time.
# Secrets: the staging ones of staging.yml, except the App Distribution credentials (nothing is distributed here).
# Changing this file is a high-risk plan; cross-review required.
name: device-session

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Vì sao chạy, ví dụ RUN-20261018-01
        required: false

concurrency:
  group: device-session
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  emulator:
    # Like staging.yml: always the main branch, the code that would be sent to the team.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Kiểm tra bí mật staging
        env:
          GOOGLE_SERVICES: ${{ secrets.STAGING_GOOGLE_SERVICES_JSON }}
          KEYSTORE: ${{ secrets.STAGING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STAGING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STAGING_KEY_ALIAS }}
        run: |
          # Only the names of missing secrets are printed, never values.
          missing=()
          [ -n "${GOOGLE_SERVICES}" ] || missing+=(STAGING_GOOGLE_SERVICES_JSON)
          [ -n "${KEYSTORE}" ] || missing+=(STAGING_KEYSTORE_BASE64)
          [ -n "${KEYSTORE_PASSWORD}" ] || missing+=(STAGING_KEYSTORE_PASSWORD)
          [ -n "${KEY_ALIAS}" ] || missing+=(STAGING_KEY_ALIAS)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Thiếu bí mật của repo: ${missing[*]}. Xem docs/ops/staging-and-runs.md."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Never write the Gradle cache from a build that saw the staging config: PR runs read that cache.
          cache-read-only: true

      - name: Đưa cấu hình staging vào
        env:
          GOOGLE_SERVICES: ${{ secrets.STAGING_GOOGLE_SERVICES_JSON }}
          KEYSTORE: ${{ secrets.STAGING_KEYSTORE_BASE64 }}
        run: |
          # The real staging config replaces the fake one (ADR-0012), so the emulator talks to the staging services.
          mkdir -p app/src/staging/release
          printf '%s' "${GOOGLE_SERVICES}" > app/src/staging/release/google-services.json
          printf '%s' "${KEYSTORE}" | base64 --decode > "${RUNNER_TEMP}/staging.keystore"

      - name: Build staging
        env:
          ORG_GRADLE_PROJECT_stagingKeystoreFile: ${{ runner.temp }}/staging.keystore
          ORG_GRADLE_PROJECT_stagingKeystorePassword: ${{ secrets.STAGING_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_stagingKeyAlias: ${{ secrets.STAGING_KEY_ALIAS }}
        run: ./gradlew --console=plain :app:assembleStagingRelease

      - name: Xóa cấu hình staging khỏi máy chạy
        run: rm -f app/src/staging/release/google-services.json "${RUNNER_TEMP}/staging.keystore"

      # Same emulator setup as the ui-test job of main-guard.yml (ADR-0043), except the emulated back camera (T-062).
      - name: Giải phóng đĩa cho emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Bật KVM cho emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Kịch bản chuẩn trên emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # An emulated back camera (a generated scene, no person) lets the camera scenarios run (T-062).
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          # stop always runs and decides the result: red when the app crashed or did not respond.
          script: bash -c 'adb install -r app/build/outputs/apk/staging/release/app-staging-release.apk && scripts/device-session.sh start ci && scripts/device-session.sh scenarios --yes; scripts/device-session.sh stop'

      - name: Tóm tắt
        if: always()
        env:
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "### Kịch bản chuẩn trên emulator"
            echo
            echo "- Commit: ${GITHUB_SHA::7}${REASON:+, lý do: ${REASON}}"
            echo
            summary="$(find test-sessions -name summary.md 2>/dev/null | head -n 1)"
            if [ -n "${summary}" ]; then cat "${summary}"; else echo "Không có summary.md: phiên không ghi được (xem log của bước trước)."; fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Lưu phiên
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-session
          path: test-sessions/
          retention-days: 7
          if-no-files-found: warn
