# Quality gate for every PR into main (ADR-0002, ADR-0010).
# One job on purpose (T-076): a job is billed at least one minute, so the path filter is the first step of
# build-and-test (id: filter) and later steps read steps.filter.outputs. The job name build-and-test is checked by
# scripts/merge-if-green.sh: rename in both places.
# The emulator tests run after the merge, in the job ui-test of main-guard.yml (ADR-0043), not on PRs.
# scripts/main-guard-verified.sh reads the job build-and-test and its step "Cổng chất lượng (scripts/check.sh)" (ADR-0039):
# renaming either means changing GATE_JOB or GATE_STEP there in the same PR.
# build-and-test has two paths: a PR with code runs scripts/check.sh; a PR without code (docs only, or files outside
# the code filter) runs only scripts/tests/run.sh, without Gradle or the Android SDK (L-040). The job is skipped only
# for draft PRs (ADR-0041), by its one job-level if; merge-if-green.sh refuses drafts anyway, and a PR marked ready
# for review gets a run on its head.
# build-and-test runs on the runner the repository variable HEAVY_RUNNER names, else on ubuntu-latest (ADR-0042).
# Changing this file is a high-risk plan and needs cross-review.
name: pr-check

on:
  pull_request:
    branches: [main]
    # Declaring types drops the default set: synchronize must stay, or new commits go unchecked (ADR-0041).
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Required: bash with pipefail, so `command | tee log` still fails when the command fails.
defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ${{ vars.HEAVY_RUNNER || 'ubuntu-latest' }}
    if: github.event.pull_request.draft == false
    timeout-minutes: 45
    steps:
      # On pull_request events paths-filter reads the changed files from the API (pull-requests: read), no checkout.
      - name: Lọc đường dẫn (dorny/paths-filter)
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # code: anything that affects the build or the quality gate itself.
          # release: what can break the release build (R8) while the debug build passes: libraries, build files and
          #     R8 rules (L-083).
          filters: |
            code:
              - 'app/**'
              - 'core/**'
              - 'feature/**'
              - 'build-logic/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - '.editorconfig'
              # Every script: scripts/check.sh runs scripts/tests/run.sh, which tests them (L-073).
              - 'scripts/**'
              - '.github/workflows/pr-check.yml'
            release:
              - 'gradle/libs.versions.toml'
              - 'settings.gradle.kts'
              - 'build.gradle.kts'
              - '**/build.gradle.kts'
              - 'build-logic/**'
              - 'gradle.properties'
              - '**/proguard-rules.pro'
              - '**/consumer-rules.pro'
              - '.github/workflows/pr-check.yml'

      # An empty or odd output (a renamed step id, a changed action) would send a PR with code down the docs-only
      # path below, which passes without check.sh: stop the job instead. It cannot catch a code file that no pattern
      # matches (code=false is valid); the sample-PR tests of scripts/tests/run.sh keep the patterns right.
      # The message also goes to build.log, which the failure comment prints.
      - name: Kiểm kết quả lọc đường dẫn
        env:
          CODE: ${{ steps.filter.outputs.code }}
          RELEASE: ${{ steps.filter.outputs.release }}
        run: |
          for value in "code=$CODE" "release=$RELEASE"; do
            case "${value#*=}" in
              true | false) ;;
              *)
                echo "Bộ lọc đường dẫn trả '${value#*=}' cho ${value%%=*}, cần true hoặc false." | tee -a build.log
                echo "::error::Bộ lọc đường dẫn trả '${value#*=}' cho ${value%%=*}, cần true hoặc false."
                exit 1 ;;
            esac
          done

      - uses: actions/checkout@v5

      # A self-hosted runner must be one-shot and clean before anything is set up or built (ADR-0042). Only a check
      # for configuration mistakes: a PR can change the script. Its result lines also go to build.log, which the
      # failure comment prints; the script writes the file after its checks, so `| tee` is not used.
      - name: Kiểm runner tự host (scripts/runner-check.sh)
        if: runner.environment == 'self-hosted'
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
          RUNNER_CHECK_LOG: build.log
        run: scripts/runner-check.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # A PR without code (docs only, or files outside the code filter) runs only the script tests, which also
      # check the docs: lesson numbers, foundation.md, status.py, secret scan, the latest run list (L-040).
      # No Gradle and no Android SDK here.
      - name: Test của script và tài liệu (scripts/tests/run.sh)
        if: steps.filter.outputs.code != 'true'
        timeout-minutes: 10
        run: |
          for tool in python3 jq java; do
            command -v "$tool" > /dev/null || { echo "::error::CI thiếu $tool để chạy scripts/tests/run.sh."; exit 1; }
          done
          scripts/tests/run.sh 2>&1 | tee build.log

      - if: steps.filter.outputs.code == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Cổng chất lượng (scripts/check.sh)
        if: steps.filter.outputs.code == 'true'
        run: scripts/check.sh 2>&1 | tee build.log

      # The quality gate builds debug only; R8 runs in the release build, so a library without its keep rules
      # passes check.sh and fails at staging time (L-083). No secret: the fake Firebase file and no signing config
      # give an unsigned APK, as on a dev machine.
      # The full release.log is uploaded with the reports, since the PR comment keeps only part of it.
      - name: Build bản release (R8)
        id: release
        if: steps.filter.outputs.code == 'true' && steps.filter.outputs.release == 'true'
        run: ./gradlew --console=plain :app:assembleStagingRelease 2>&1 | tee release.log

      - name: Lưu báo cáo test và ảnh screenshot
        if: always() && steps.filter.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
            **/src/test/screenshots/*.png
            release.log

      - name: Bình luận lỗi vào PR
        # A failure before the log exists (checkout, Java) still posts the comment.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            if [ "${{ steps.release.outcome }}" = "failure" ]; then
              echo "### build-and-test thất bại: build bản release thất bại"
              echo
              echo "Lỗi (R8 hay biên dịch bản release):"
              echo '```'
              grep -E "ERROR: R8:|Missing class|What went wrong" -A 3 release.log | head -n 80 || true
              echo '```'
              echo "Cuối log:"
              echo '```'
              tail -n 40 release.log 2>/dev/null || echo "Không có log."
              echo '```'
            else
              echo "### build-and-test thất bại"
              echo
              echo "Task thất bại và lỗi:"
              echo '```'
              grep -E "^FAIL - | FAILED$|^e: |Lint error|\.kt:[0-9]+:[0-9]+|error:|What went wrong" -A 6 build.log | head -n 150 || true
              echo '```'
              echo "Cuối log:"
              echo '```'
              tail -n 60 build.log 2>/dev/null || echo "Không có log."
              echo '```'
            fi
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file comment.md
