# Tells people when an auto-run session has gone quiet (L-109). Every 30 minutes, scripts/run-watchdog.py looks
# for a run file that is still "running" on its report branch but whose branches have had no commit for 60 minutes
# (90 while a workflow run it may be waiting for is still going), and opens or updates one issue labelled
# session-stalled with the prompt to paste; it closes the issue when the session commits again or the run is no
# longer "running". A session opened with `claude --cloud` is not continued by resume-run.yml (L-044), so this
# issue is how a person learns it must be reopened.
# Only reads the repository and writes session-stalled issues: never starts a session or a routine, never touches
# main-broken or any other issue. Needs no secret. About 2 Actions minutes a run, one per job (the Actions quota once ran out,
# L-064, L-126): the idle job disables this workflow while no session needs it, and status-page.yml (an approved run
# list on main), start-run.yml and the session enable it again (scripts/schedule-idle.py, T-051). An app that does
# not want it: delete this file (nothing else reads its issues).
# Changing this file is a high-risk plan; cross-review required.
name: run-watchdog

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: run-watchdog
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  watch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Tìm phiên không có commit mới
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/run-watchdog.py | tee -a "${GITHUB_STEP_SUMMARY}"

  # Turns this workflow off once no session needs it (T-051): scripts/schedule-idle.py keeps it on while a session is
  # running, an approved run list waits, or it was enabled or start-run ran in the last 3 hours. A job of its own, so
  # only it may write Actions. Never turns the workflow red.
  idle:
    needs: watch
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Tắt lịch khi không có phiên
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/schedule-idle.py --disable-if-idle run-watchdog.yml | tee -a "${GITHUB_STEP_SUMMARY}"
