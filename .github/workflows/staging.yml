# Builds the staging variant from main and sends it to the team through Firebase App Distribution
# (ADR-0007, ADR-0009, ADR-0016). Started by hand, or by the auto-run session when at least one task was merged.
# Secrets (staging only, added by people, never read or printed by AI):
#   STAGING_GOOGLE_SERVICES_JSON          google-services.json of the staging Firebase project
#   STAGING_APP_DISTRIBUTION_CREDENTIALS  service account JSON allowed to upload to App Distribution
#   STAGING_KEYSTORE_BASE64               staging-only signing keystore, base64 encoded
#   STAGING_KEYSTORE_PASSWORD             its password (also the key password)
#   STAGING_KEY_ALIAS                     its key alias
# Variable (not secret): STAGING_TESTER_GROUPS, comma-separated App Distribution groups, default "team".
# Changing this file is a high-risk plan; cross-review required.
name: staging

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Ghi chú cho người test (để trống thì dùng tiêu đề commit)
        required: false
        default: ''

# One staging build at a time; a newer request waits instead of cancelling a build being sent.
concurrency:
  group: staging
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  # Replaced by the init script when a new app is created from the template.
  STAGING_APPLICATION_ID: com.vglstudio.camera.pose.line.guide.staging

jobs:
  distribute:
    # Staging is always built from main, whatever branch the workflow is started on.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Kiểm tra bí mật staging
        env:
          GOOGLE_SERVICES: ${{ secrets.STAGING_GOOGLE_SERVICES_JSON }}
          DISTRIBUTION_CREDENTIALS: ${{ secrets.STAGING_APP_DISTRIBUTION_CREDENTIALS }}
          KEYSTORE: ${{ secrets.STAGING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STAGING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STAGING_KEY_ALIAS }}
        run: |
          # Only the names of missing secrets are printed, never values.
          missing=()
          [ -n "${GOOGLE_SERVICES}" ] || missing+=(STAGING_GOOGLE_SERVICES_JSON)
          [ -n "${DISTRIBUTION_CREDENTIALS}" ] || missing+=(STAGING_APP_DISTRIBUTION_CREDENTIALS)
          [ -n "${KEYSTORE}" ] || missing+=(STAGING_KEYSTORE_BASE64)
          [ -n "${KEYSTORE_PASSWORD}" ] || missing+=(STAGING_KEYSTORE_PASSWORD)
          [ -n "${KEY_ALIAS}" ] || missing+=(STAGING_KEY_ALIAS)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Thiếu bí mật của repo: ${missing[*]}. Xem docs/ops/staging-and-runs.md."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Never write the Gradle cache from a build that saw the staging config: PR runs read that cache.
          cache-read-only: true

      - name: Đưa cấu hình staging vào
        env:
          GOOGLE_SERVICES: ${{ secrets.STAGING_GOOGLE_SERVICES_JSON }}
          DISTRIBUTION_CREDENTIALS: ${{ secrets.STAGING_APP_DISTRIBUTION_CREDENTIALS }}
          KEYSTORE: ${{ secrets.STAGING_KEYSTORE_BASE64 }}
        run: |
          # The real staging config goes in src/staging/release, where it replaces the fake one (ADR-0012).
          mkdir -p app/src/staging/release
          printf '%s' "${GOOGLE_SERVICES}" > app/src/staging/release/google-services.json
          printf '%s' "${DISTRIBUTION_CREDENTIALS}" > "${RUNNER_TEMP}/distribution-credentials.json"
          printf '%s' "${KEYSTORE}" | base64 --decode > "${RUNNER_TEMP}/staging.keystore"

          # The Firebase app id is not secret; it identifies the staging app for App Distribution.
          app_id="$(jq -r --arg pkg "${STAGING_APPLICATION_ID}" \
            '.client[] | select(.client_info.android_client_info.package_name == $pkg) | .client_info.mobilesdk_app_id' \
            app/src/staging/release/google-services.json)"
          if [ -z "${app_id}" ] || [ "${app_id}" = "null" ]; then
            echo "::error::google-services.json của staging không có app ${STAGING_APPLICATION_ID}."
            exit 1
          fi
          if jq -e '.project_info.project_id == "fake-staging-project"' \
            app/src/staging/release/google-services.json > /dev/null; then
            echo "::error::STAGING_GOOGLE_SERVICES_JSON đang là file cấu hình giả, cần file của project staging thật."
            exit 1
          fi
          echo "FIREBASE_APP_ID=${app_id}" >> "${GITHUB_ENV}"

      - name: Build staging
        env:
          ORG_GRADLE_PROJECT_stagingKeystoreFile: ${{ runner.temp }}/staging.keystore
          ORG_GRADLE_PROJECT_stagingKeystorePassword: ${{ secrets.STAGING_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_stagingKeyAlias: ${{ secrets.STAGING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_stagingBuildNumber: ${{ github.run_number }}
        run: ./gradlew --console=plain :app:assembleStagingRelease

      - name: Phát qua Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/distribution-credentials.json
          TESTER_GROUPS: ${{ vars.STAGING_TESTER_GROUPS || 'team' }}
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
        run: |
          apk="app/build/outputs/apk/staging/release/app-staging-release.apk"
          if [ ! -f "${apk}" ]; then
            echo "::error::Không tìm thấy ${apk}."
            exit 1
          fi
          notes="${RELEASE_NOTES_INPUT:-$(git log -1 --format=%s)}"
          printf '%s\n\nCommit: %s\nWorkflow: %s\n' "${notes}" "${GITHUB_SHA::7}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > release-notes.txt
          npx --yes firebase-tools@15.32.1 appdistribution:distribute "${apk}" \
            --app "${FIREBASE_APP_ID}" \
            --groups "${TESTER_GROUPS}" \
            --release-notes-file release-notes.txt

      - name: Tóm tắt
        env:
          TESTER_GROUPS: ${{ vars.STAGING_TESTER_GROUPS || 'team' }}
        run: |
          {
            echo "### Bản staging đã phát"
            echo
            echo "- Phiên bản: hậu tố -staging.${GITHUB_RUN_NUMBER}, versionCode ${GITHUB_RUN_NUMBER}"
            echo "- Commit: ${GITHUB_SHA::7}"
            echo "- Nhóm người test: ${TESTER_GROUPS}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Xóa cấu hình staging khỏi máy chạy
        if: always()
        run: rm -f app/src/staging/release/google-services.json "${RUNNER_TEMP}/distribution-credentials.json" "${RUNNER_TEMP}/staging.keystore"
