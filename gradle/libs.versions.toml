play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "playServicesAds" }
admob-mediation-applovin = { group = "com.google.ads.mediation", name = "applovin", version.ref = "admobMediationApplovin" }
admob-mediation-meta = { group = "com.google.ads.mediation", name = "facebook", version.ref = "admobMediationMeta" }
admob-mediation-dtexchange = { group = "com.google.ads.mediation", name = "fyber", version.ref = "admobMediationDtExchange" }
admob-mediation-inmobi = { group = "com.google.ads.mediation", name = "inmobi", version.ref = "admobMediationInmobi" }
admob-mediation-ironsource = { group = "com.google.ads.mediation", name = "ironsource", version.ref = "admobMediationIronsource" }
admob-mediation-mintegral = { group = "com.google.ads.mediation", name = "mintegral", version.ref = "admobMediationMintegral" }
admob-mediation-moloco = { group = "com.google.ads.mediation", name = "moloco", version.ref = "admobMediationMoloco" }
admob-mediation-pangle = { group = "com.google.ads.mediation", name = "pangle", version.ref = "admobMediationPangle" }
admob-mediation-unity = { group = "com.google.ads.mediation", name = "unity", version.ref = "admobMediationUnity" }
unity-ads = { group = "com.unity3d.ads", name = "unity-ads", version.ref = "unityAds" }
applovin-sdk = { group = "com.applovin", name = "applovin-sdk", version.ref = "applovinSdk" }
max-mediation-google = { group = "com.applovin.mediation", name = "google-adapter", version.ref = "maxMediationGoogle" }
user-messaging-platform = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "userMessagingPlatform" }

junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

# Gradle plugins used by build-logic (compileOnly there)
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
roborazzi-gradlePlugin = { group = "io.github.takahirom.roborazzi", name = "roborazzi-gradle-plugin", version.ref = "roborazzi" }
ktlint-gradlePlugin = { group = "org.jlleitschuh.gradle", name = "ktlint-gradle", version.ref = "ktlintGradle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsGradle" }

# Convention plugins defined in build-logic
template-android-application = { id = "template.android.application" }
template-android-library = { id = "template.android.library" }
template-android-compose = { id = "template.android.compose" }
template-android-feature = { id = "template.android.feature" }
template-hilt = { id = "template.hilt" }
