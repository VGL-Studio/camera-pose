[versions]
# Android SDK
compileSdk = "37"
targetSdk = "36"
minSdk = "26"

# Build toolchain
androidGradlePlugin = "9.1.0"
kotlin = "2.2.10"
ksp = "2.3.12"
ktlintGradle = "14.2.0"

# AndroidX
androidxActivity = "1.10.1"
androidxCore = "1.16.0"
androidxLifecycle = "2.9.2"
androidxNavigation = "2.9.8"
androidxHiltNavigationCompose = "1.2.0"
androidxDataStore = "1.1.7"
composeBom = "2025.09.00"

# DI
hilt = "2.59.2"

# Kotlin libraries
kotlinxCoroutines = "1.10.2"
kotlinxSerializationJson = "1.9.0"

# Firebase
firebaseBom = "34.19.0"
googleServices = "4.5.0"
firebaseCrashlyticsGradle = "3.0.8"

# Camera, pose detection, in-app review (spec camera, question 9)
camerax = "1.6.2"
# The version Firebase already brings at runtime; the compile classpath only gains it (plan T-031).
guava = "31.1-android"
# Pose detection has no stable release yet; 18.0.0-beta5 is the latest.
mlkitPoseDetection = "18.0.0-beta5"
playReview = "2.0.2"

# Ads
playServicesAds = "25.5.0"
userMessagingPlatform = "4.0.0"
admobMediationApplovin = "13.6.4.2"
admobMediationMeta = "6.22.0.1"
admobMediationDtExchange = "8.5.0.0"
admobMediationInmobi = "11.5.0.0"
admobMediationIronsource = "9.6.1.0"
admobMediationMintegral = "17.1.81.1"
admobMediationMoloco = "4.13.0.0"
admobMediationPangle = "8.3.0.4.0"
admobMediationUnity = "4.21.0.0"
unityAds = "4.21.0"
applovinSdk = "13.6.4"
maxMediationGoogle = "25.5.0.0"

# Testing
junit4 = "4.13.2"
mockk = "1.14.5"
turbine = "1.2.1"
robolectric = "4.17"
roborazzi = "1.77.0"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
